# source of truth: ./colorscheme/build.py generates the palette files and
# ghostty themes from this, so edit here and rerun it

name = "graffiti"

[settings]
cursor = "Bibata-Modern-Classic"
gtk_accent = "pink"  # libadwaita's closest named accent

# roles, in the order they're written out:
#   bg       mortar, and the wall behind everything
#   panel    bricks, menus
#   surface  hover, inactive label tape, one step above panel
#   fg       body text
#   dim      secondary text, marker tags, duct tape
#   ink      outlines, label tape, marker
#   paper    xerox paper and white label tape, light in both modes
#   accent   hot pink spray paint, the only colour the UI uses
#   yellow, acid, cyan, blue, violet, orange, red
#            highlighter inks: terminal colours and errors only; acid
#            is also the wallpaper's second can of paint

[dark]
bg = "18181a"
panel = "252527"
surface = "343437"
fg = "ebe8e1"
dim = "8a8882"
ink = "0a0a0a"
paper = "ebe8e1"
accent = "ff3d8b"
yellow = "ffd23f"
acid = "b8f028"
cyan = "3fd8e8"
blue = "7d95ff"
violet = "b07cff"
orange = "ff9a3c"
red = "ff4b3e"

[dark.terminal]
foreground = "ebe8e1"
background = "111113"
cursor = "ff3d8b"
cursor_text = "111113"
selection_bg = "ff3d8b"
selection_fg = "0a0a0a"
ansi = [
  "343437", "ff4b3e", "b8f028", "ffd23f", "7d95ff", "ff3d8b", "3fd8e8", "d6d3cc",
  "8a8882", "ff7466", "cdf866", "ffe07a", "a3b4ff", "ff72ab", "7ce6f0", "ebe8e1",
]

[light]
bg = "d8d5ce"
panel = "cdc9c1"
surface = "bdb9b0"
fg = "151515"
dim = "625f59"
ink = "151515"
paper = "f6f4ee"
accent = "d4106c"
yellow = "a87d00"
acid = "5f8a00"
cyan = "00838f"
blue = "2f55d4"
violet = "7b3fd0"
orange = "c25a00"
red = "c81e1e"

[light.terminal]
foreground = "151515"
background = "e4e1da"
cursor = "d4106c"
cursor_text = "e4e1da"
selection_bg = "d4106c"
selection_fg = "f6f4ee"
# yellow (3) is darkened so text stays readable on the light wall
ansi = [
  "151515", "c81e1e", "5f8a00", "8a6700", "2f55d4", "d4106c", "00838f", "4a4844",
  "625f59", "e0392f", "6f9e00", "a87d00", "4a6de0", "e0408a", "0097a5", "bdb9b0",
]
