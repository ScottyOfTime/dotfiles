# source of truth: ./colorscheme/build.py generates the palette files,
# ghostty themes, herdr and vim colours from this, so edit here and rerun it

name = "oldschool"

[settings]
cursor = "Chicago95_Cursor_White"
gtk_accent = "yellow"

# roles, in the order they're written out:
#   bg       the tube: wallpaper, lock, overview
#   panel    bar, strips, boxes
#   surface  a step off panel: workspace shown on an unfocused monitor
#   fg       phosphor: text, and the fill for reverse-video selection
#   dim      low-intensity text: keys, titles, secondary
#   ink      same as fg (editor/herdr use it)
#   line     unfocused borders, the bar's underline
#   bright   hot phosphor: focused borders, prompts, emphasis
#   red      errors only
#   blue, orange, yellow, green, cyan, purple
#            terminal and editor colours only, all warm-shifted

[dark]
bg = "0b0806"
panel = "120d08"
surface = "2b1c0c"
fg = "ffb52e"
dim = "9a6a24"
ink = "ffb52e"
line = "3d2810"
bright = "ffd27a"
red = "ff5533"
blue = "7aa6b8"
orange = "ff8a2a"
yellow = "ffcf4a"
green = "b8c25a"
cyan = "86c2a8"
purple = "d48aa0"

[dark.terminal]
foreground = "ffb52e"
background = "0b0806"
cursor = "ffb52e"
cursor_text = "0b0806"
selection_bg = "ffb52e"
selection_fg = "0b0806"
ansi = [
  "2b1c0c", "ff5533", "b8c25a", "ffcf4a", "7aa6b8", "d48aa0", "86c2a8", "e0a640",
  "9a6a24", "ff7a5a", "ccd47a", "ffdc7a", "9cc0d0", "e6a8b8", "a6d6c0", "ffd27a",
]

