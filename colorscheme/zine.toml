# source of truth: ./colorscheme/build.py generates the palette files and
# ghostty themes from this, so edit here and rerun it

name = "zine"

[settings]
cursor = "Bibata-Modern-Classic"
gtk_accent = "orange"  # libadwaita's closest named accent

# roles, in the order they're written out:
#   bg       page background
#   panel    raised surfaces: bar pills, menus, notifications
#   surface  hover / inactive chips, one step above panel
#   fg       body text
#   dim      secondary text, placeholders
#   ink      outlines and hard offset shadows
#   shade    unfocused window shadows, softer than ink
#   accent   pale orange, the only colour the UI uses: focus, active tab
#   mustard, sage, teal, blue, rose, plum, red
#            the riso inks: terminal colours and errors only

[dark]
bg = "1f1c19"
panel = "2a2622"
surface = "36312c"
fg = "ecdfcc"
dim = "8a7f70"
ink = "0b0a09"
shade = "141210"
accent = "db9257"
mustard = "dbb56e"
sage = "9fb68a"
teal = "82b3ab"
blue = "8aa7cf"
rose = "d39aa6"
plum = "ab8fc6"
red = "d9705f"

[dark.terminal]
foreground = "ecdfcc"
background = "161412"
cursor = "db9257"
cursor_text = "161412"
selection_bg = "db9257"
selection_fg = "0b0a09"
ansi = [
  "36312c", "d9705f", "9fb68a", "dbb56e", "8aa7cf", "ab8fc6", "82b3ab", "cfc3b1",
  "8a7f70", "e88a7a", "b5cba0", "e8c98a", "a4bde0", "c4a9da", "9cc9c1", "ecdfcc",
]

[light]
bg = "f1e6d6"
panel = "e8dbc7"
surface = "dccdb6"
fg = "2a2420"
dim = "8a7d6c"
ink = "2a2420"
shade = "2a2420"
accent = "b76d38"
mustard = "c79a3c"
sage = "6f8c58"
teal = "4a8a82"
blue = "5a7bab"
rose = "b5677a"
plum = "82659f"
red = "b54a3c"

[light.terminal]
foreground = "2a2420"
background = "f1e6d6"
cursor = "b76d38"
cursor_text = "f1e6d6"
selection_bg = "b76d38"
selection_fg = "f1e6d6"
# yellow (3) is darkened from mustard so text stays readable on the paper
ansi = [
  "2a2420", "b54a3c", "6f8c58", "a67c22", "5a7bab", "82659f", "4a8a82", "5c5249",
  "8a7d6c", "c4604f", "7e9b66", "b88a2e", "6b8cbd", "9479b0", "5a9a92", "e8dbc7",
]
