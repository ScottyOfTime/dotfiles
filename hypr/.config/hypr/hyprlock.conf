# flat lock screen: solid background, big clock, accent-edged input
# colours come from hyprlock-colors.conf, which darkman renders from the palette
source = ~/.config/hypr/hyprlock-colors.conf

general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    color = $bg
}

# clock
label {
    monitor =
    text = $TIME
    color = $fg
    font_size = 120
    font_family = JetBrains Mono ExtraBold
    position = 0, 140
    halign = center
    valign = center
}

# date
label {
    monitor =
    text = cmd[update:60000] date +"%A %d/%m/%Y"
    color = $dim
    font_size = 18
    font_family = JetBrains Mono
    position = 0, 30
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 360, 48
    outline_thickness = 2
    rounding = 0
    outer_color = $accent
    inner_color = $bg
    font_color = $fg
    check_color = $accent
    fail_color = $red
    capslock_color = $accent
    dots_rounding = 0
    dots_spacing = 0.3
    fade_on_empty = false
    placeholder_text =
    fail_text = $FAIL
    position = 0, -60
    halign = center
    valign = center
}
